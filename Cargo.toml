[package]
name = "quasi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bat = "0.26.1"
minreq = { version = "3.0.0", features = ["https"] }
rand = "0.10.3"
rustyline = { version = "19.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
terminal_size = "0.4.4"
tiny_http = "0.12.0"
urlencoding = "2.1.3"

[[bin]]
name = "qsi"
path = "src/main.rs"
